name: ARM64 release
on:
  push:
    tags: ["v*-plana.*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binaries:
    runs-on: depot-ubuntu-24.04-arm-4
    container: debian:bookworm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install native build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev zip file python3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native ARM64 and test both modules
        run: |
          test "$(uname -m)" = aarch64
          unset GOCACHEPROG
          go vet ./...
          go test -count=1 -race ./...
          cd deriver
          go vet ./...
          go test -count=1 -race ./...
      - name: Build and verify native plugin ABI
        run: |
          mkdir dist
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -buildmode=c-shared -o dist/clickhouse-sink.so .
          (cd deriver && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=false -o ../dist/clickhouse-deriver-linux-arm64 .)
          file dist/clickhouse-sink.so dist/clickhouse-deriver-linux-arm64
          python3 scripts/verify_arm64_release.py
      - name: Package for CLIProxyAPI plugin store
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version="0.1.0-plana.2"; fi
          (
            cd dist
            zip -X "clickhouse-sink_${version}_linux_arm64.zip" clickhouse-sink.so
            sha256sum -- *.zip > checksums.txt
            sha256sum -- *.so *.h clickhouse-deriver-linux-arm64 *.zip checksums.txt > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: clickhouse-sink-linux-arm64
          path: dist/
          if-no-files-found: error
      - name: Publish verified ARM64 assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
